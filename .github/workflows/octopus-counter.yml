name: Update Octopus Counter

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - render_counter.py
      - assets/octopus-digits/**
      - .github/workflows/octopus-counter.yml

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  counter:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Render live visitor count
        run: python render_counter.py
      - name: Save counter image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/octopus-counter.png
          if ! git diff --cached --quiet; then
            git commit -m "Update octopus visitor counter"
            git push
          fi
