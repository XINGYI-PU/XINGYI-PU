name: Update Profile Images

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/profile-images.yml

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  contributions:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%23800080
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23c084fc

      - name: Generate green 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Save generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution images"
            git push
          fi

  calendar:
    needs: contributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add METRICS_TOKEN in repository Settings > Secrets and variables > Actions. See SETUP.md."
            exit 1
          fi

      - name: Generate contribution calendar and streak statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.event.repository.default_branch }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Seoul
          config_animations: yes
          config_padding: 0, 8
          plugins_errors_fatal: yes
